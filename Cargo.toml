[package]
name = "tesla-screen-sender"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Standalone Windows screen sender with a local Tesla browser receiver"

[[bin]]
name = "tesla-screen-sender"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["ws"] }
local-ip-address = "0.6"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
openh264 = { version = "0.9", features = ["source"] }
windows-capture = "2.0"

[dev-dependencies]
http-body-util = "0.1"
tower = "0.5"
